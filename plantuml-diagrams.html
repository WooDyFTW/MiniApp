<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlantUML Diagram Builder</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#1c2230;--mut:#667085;--line:#d0d5dd;--acc:#2f6fed;--node:#fff;--code:#0f1623;--codeink:#d6e2ff;--dot:#d9dee7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--panel:#171d29;--ink:#e6eaf2;--mut:#98a2b3;--line:#2b3445;--acc:#6f9bff;--node:#1f2735;--code:#0a0e15;--codeink:#cfe0ff;--dot:#262f40}}
:root[data-theme="dark"]{--bg:#10141c;--panel:#171d29;--ink:#e6eaf2;--mut:#98a2b3;--line:#2b3445;--acc:#6f9bff;--node:#1f2735;--code:#0a0e15;--codeink:#cfe0ff;--dot:#262f40}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-columns:150px 1fr 340px;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 8px 0 0}
.sp{flex:1}
button,.btn,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;text-decoration:none}
button:hover,.btn:hover{border-color:var(--acc)}
.pri,.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
#tabs{display:flex;gap:4px;flex-wrap:wrap}
label{color:var(--mut);font-size:13px}
aside{background:var(--panel);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
aside small{color:var(--mut)}
.pal{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;cursor:grab;user-select:none;touch-action:none;font-size:12px}
.pal:hover{border-color:var(--acc)}
.pal svg{display:block;margin:0 auto 3px;height:auto}
.node svg *,.pal svg *{fill:var(--node);stroke:var(--ink);stroke-width:1.6}
.node svg .f,.pal svg .f{fill:var(--ink)}
.node svg line,.pal svg line{fill:none}
#cv{position:relative;overflow:auto;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:20px 20px}
#stage{position:relative;width:2000px;height:1400px}
#edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:var(--ink)}
#nodes{position:absolute;inset:0}
.node{position:absolute;cursor:grab;touch-action:none;user-select:none}
.node svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node.sel svg *{stroke:var(--acc);stroke-width:2.6}
.node .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px;font-size:13px;line-height:1.2;overflow:hidden;pointer-events:none}
.node .t.pad{padding-left:40px}
.node .t.cls{display:block;padding:0;text-align:left}
.cn{text-align:center;font-weight:600;height:30px;line-height:30px;overflow:hidden}
.cn i{font:400 11px system-ui,sans-serif;color:var(--mut);margin-right:5px}
.cm{padding:5px 8px;font:12px/16px ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.node .h{position:absolute;right:-8px;top:50%;margin-top:-7px;width:14px;height:14px;border-radius:50%;background:var(--acc);border:2px solid var(--panel);cursor:crosshair;opacity:0;touch-action:none}
.node:hover .h,.node.sel .h{opacity:1}
.ln{stroke:var(--ink);stroke-width:1.6;fill:none}
.ln.sel{stroke:var(--acc);stroke-width:2.6}
.dsh{stroke-dasharray:7 5}
.life{stroke:var(--mut);stroke-width:1.2;stroke-dasharray:5 5}
.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.tmp{stroke:var(--acc);stroke-width:2;stroke-dasharray:5 4}
.lbl{font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;pointer-events:auto;cursor:text}
.mk{fill:var(--ink)}.mh{fill:var(--panel);stroke:var(--ink);stroke-width:1}
.ed{position:absolute;width:150px;font:inherit;padding:4px 6px;border:2px solid var(--acc);border-radius:6px;background:var(--panel);color:var(--ink);z-index:5;box-sizing:border-box}
textarea.ed{width:200px;height:120px;resize:none}
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side .bar{display:flex;gap:6px;flex-wrap:wrap;padding:10px;border-bottom:1px solid var(--line)}
#code{flex:1;min-height:140px;margin:0;border:0;resize:none;padding:12px;background:var(--code);color:var(--codeink);font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;outline:none}
.hint{padding:8px 12px;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
@media (max-width:820px){
 html,body{height:auto}
 #app{display:block;height:auto}
 aside{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line)}
 .pal{width:92px}
 #cv{height:55vh}
 #side{border-left:0;border-top:1px solid var(--line)}
 #code{min-height:240px}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1>PlantUML Builder</h1>
  <div id="tabs"></div>
  <span class="sp"></span>
  <label>Arrow <select id="kind" disabled></select></label>
  <label id="ltrw"><input type="checkbox" id="ltr"> Left to right</label>
  <button id="ex">Example</button>
  <button id="clr">Clear</button>
  <button id="del">Delete selected</button>
 </header>
 <aside id="pal"></aside>
 <div id="cv"><div id="stage"><svg id="edges"></svg><div id="nodes"></div></div></div>
 <section id="side">
  <div class="bar">
   <button id="copy" class="pri">Copy code</button>
   <a id="open" class="btn" target="_blank" rel="noopener">Open in PlantUML ↗</a>
  </div>
  <textarea id="code" readonly spellcheck="false"></textarea>
  <div class="hint" id="hint"></div>
 </section>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const stage=$('#stage'),svg=$('#edges'),nl=$('#nodes'),cv=$('#cv');
const R=(w,h,rx=6)=>`<rect x="2" y="2" width="${w-4}" height="${h-4}" rx="${rx}"/>`;
const EL=(w,h)=>`<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2-3}" ry="${h/2-3}"/>`;
const PG=p=>`<polygon points="${p}"/>`;
const DB=(w,h)=>{const r=(w-4)/2;return `<path d="M2 12A${r} 10 0 0 1 ${w-2} 12V${h-12}A${r} 10 0 0 1 2 ${h-12}Z M2 12A${r} 10 0 0 0 ${w-2} 12"/>`};
const CL=(w,h)=>R(w,h,3)+`<line x1="2" y1="30" x2="${w-2}" y2="30"/>`;
const T={
 start:{n:'Start',kw:'usecase',w:150,h:60,t:'Start',s:EL},
 end:{n:'End',kw:'usecase',w:150,h:60,t:'End',s:EL},
 proc:{n:'Process',kw:'rectangle',w:150,h:60,t:'Process',s:R},
 sub:{n:'Subroutine',kw:'card',w:150,h:60,t:'Subroutine',s:(w,h)=>R(w,h,2)+`<line x1="14" y1="2" x2="14" y2="${h-2}"/><line x1="${w-14}" y1="2" x2="${w-14}" y2="${h-2}"/>`},
 dec:{n:'Decision',kw:'diamond',w:150,h:60,t:'Decision?',s:(w,h)=>PG(`${w/2},1 ${w-1},${h/2} ${w/2},${h-1} 1,${h/2}`)},
 data:{n:'Data / IO',kw:'queue',w:150,h:60,t:'Data',s:(w,h)=>PG(`22,2 ${w-2},2 ${w-22},${h-2} 2,${h-2}`)},
 db:{n:'Database',kw:'database',w:150,h:60,t:'Database',s:DB},
 doc:{n:'Document',kw:'file',w:150,h:60,t:'Document',s:(w,h)=>`<path d="M2 2H${w-18}L${w-2} 18V${h-2}H2Z M${w-18} 2V18H${w-2}"/>`},
 hex:{n:'Preparation',kw:'hexagon',w:150,h:60,t:'Preparation',s:(w,h)=>PG(`16,2 ${w-16},2 ${w-2},${h/2} ${w-16},${h-2} 16,${h-2} 2,${h/2}`)},
 init:{n:'Initial',w:30,h:30,nt:1,s:()=>'<circle class="f" cx="15" cy="15" r="12"/>'},
 fin:{n:'Final',w:30,h:30,nt:1,s:()=>'<circle cx="15" cy="15" r="13"/><circle class="f" cx="15" cy="15" r="7"/>'},
 state:{n:'State',kw:'state',w:150,h:60,t:'State',s:(w,h)=>R(w,h,16)},
 choice:{n:'Choice',st:'choice',w:44,h:44,nt:1,s:(w,h)=>PG(`${w/2},1 ${w-1},${h/2} ${w/2},${h-1} 1,${h/2}`)},
 fork:{n:'Fork / Join',st:'fork',w:120,h:12,nt:1,s:(w,h)=>`<rect class="f" x="0" y="0" width="${w}" height="${h}" rx="3"/>`},
 class:{n:'Class',kw:'class',cls:1,t:'ClassName\n+field : Type\n+method()',s:CL},
 iface:{n:'Interface',kw:'interface',st:'interface',cls:1,t:'Interface\n+method()',s:CL},
 abs:{n:'Abstract',kw:'abstract class',st:'abstract',cls:1,t:'AbstractName\n+method()',s:CL},
 enum:{n:'Enum',kw:'enum',st:'enum',cls:1,t:'Color\nRED\nGREEN',s:CL},
 part:{n:'Participant',kw:'participant',w:120,h:44,t:'Participant',s:R},
 actor:{n:'Actor',kw:'actor',w:120,h:44,t:'Actor',s:()=>'<circle cx="18" cy="9" r="6"/><line x1="18" y1="15" x2="18" y2="28"/><line x1="9" y1="20" x2="27" y2="20"/><line x1="18" y1="28" x2="10" y2="40"/><line x1="18" y1="28" x2="26" y2="40"/>'},
 sdb:{n:'Database',kw:'database',w:120,h:44,t:'Database',s:DB}
};
const K={
 arrow:{op:'-->',n:'Arrow',me:'ar'},line:{op:'--',n:'Line'},dash:{op:'..>',n:'Dashed arrow',d:1,me:'ar'},
 inherit:{op:'--|>',n:'Inheritance',me:'tri'},impl:{op:'..|>',n:'Realization',d:1,me:'tri'},
 compose:{op:'*--',n:'Composition',ms:'dia'},aggr:{op:'o--',n:'Aggregation',ms:'dih'},
 sync:{op:'->',n:'Message',me:'ar'},ret:{op:'-->',n:'Return (dashed)',d:1,me:'ar'},async:{op:'->>',n:'Async message',me:'ar'}
};
const M={
 flow:{n:'Flowchart',ty:['start','proc','sub','dec','data','db','doc','hex','end'],ki:['arrow','line','dash'],h:'Drag the blue dot on a shape onto another shape to connect. Double-click a shape or arrow to edit its text.'},
 state:{n:'State',ty:['init','state','choice','fork','fin'],ki:['arrow','dash'],h:'Drag the blue dot onto another state to add a transition. Initial and final shapes become [*] in the code.'},
 cls:{n:'Class',ty:['class','iface','abs','enum'],ki:['arrow','inherit','impl','dash','compose','aggr','line'],h:'Double-click a class to edit: the first line is the name, other lines are members. Select an arrow, then pick its type at the top.'},
 seq:{n:'Sequence',ty:['part','actor','sdb'],ki:['sync','ret','async'],h:'Drag the blue dot toward another participant line to add a message (drop on the same one for a self message). Drag a message up or down to reorder.'}
};
let mode='flow',docs={},nodes=[],edges=[],sel=null,uid=1,ltr=false;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const byId=id=>nodes.find(n=>n.id===id);
const pt=e=>{const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function size(n){const t=T[n.type];if(t.cls){const L=n.text.split('\n'),m=L.length-1,mx=Math.max(...L.map(s=>s.length));return{w:Math.max(150,Math.round(mx*7.4+26)),h:Math.max(56,38+m*16)}}return{w:t.w,h:t.h}}
const center=n=>{const s=size(n);return{x:n.x+s.w/2,y:n.y+s.h/2}};
function addNode(type,x,y,text){const n={id:'n'+(uid++),type,x:Math.max(0,x),y:mode==='seq'?20:Math.max(0,y),text:text??T[type].t??''};nodes.push(n);return n}
const A=addNode;
const L=(a,b,l,k,y)=>edges.push({id:'e'+(uid++),from:a.id,to:b.id,label:l||'',kind:k||M[mode].ki[0],y});
const EX={
 flow(){const s=A('start',200,30),p=A('proc',200,130,'Read input'),d=A('dec',200,230,'Valid?'),r=A('proc',430,230,'Show error'),e=A('end',200,350);L(s,p);L(p,d);L(d,e,'Yes');L(d,r,'No');L(r,p)},
 state(){const i=A('init',120,30),a=A('state',80,100,'Idle'),b=A('state',340,100,'Running'),f=A('fin',405,250);L(i,a);L(a,b,'start');L(b,a,'stop');L(b,f,'quit')},
 cls(){const a=A('abs',220,40,'Animal\n+name : String\n+speak()'),d=A('class',80,230,'Dog\n+fetch()'),c=A('class',360,230,'Cat\n+purr()');L(d,a,'','inherit');L(c,a,'','inherit')},
 seq(){const b=A('part',60,20,'Browser'),s=A('part',260,20,'Server'),d=A('sdb',460,20,'DB');L(b,s,'GET /page','sync',120);L(s,d,'query','sync',170);L(d,s,'rows','ret',220);L(s,b,'200 OK','ret',270)}
};

function save(){docs[mode]={nodes,edges};try{localStorage.setItem('puml-multi',JSON.stringify({mode,docs,uid,ltr}))}catch(e){}}
function load(){
 try{
  const d=JSON.parse(localStorage.getItem('puml-multi'));
  if(d&&d.docs){docs=d.docs;mode=d.mode in M?d.mode:'flow';uid=d.uid||1;ltr=!!d.ltr;const c=docs[mode]||{nodes:[],edges:[]};nodes=c.nodes;edges=c.edges;return true}
  const o=JSON.parse(localStorage.getItem('puml-flow'));
  if(o&&o.nodes){nodes=o.nodes;edges=o.edges||[];uid=o.uid||1;return true}
 }catch(e){}
 return false;
}

function gen(){
 const q=s=>s.replace(/"/g,"'").replace(/\s+/g,' ').trim();
 const ref=n=>n.type==='init'||n.type==='fin'?'[*]':n.id;
 let o='@startuml\n';
 if(ltr&&mode!=='seq')o+='left to right direction\n';
 const ns=nodes.slice();
 if(mode==='seq')ns.sort((a,b)=>a.x-b.x);
 ns.forEach(n=>{
  const t=T[n.type];
  if(n.type==='init'||n.type==='fin')return;
  if(n.type==='choice'||n.type==='fork'){o+='state '+n.id+' <<'+t.st+'>>\n';return}
  if(t.cls){
   const l=n.text.split('\n').map(s=>s.trim()),m=l.slice(1).filter(Boolean);
   o+=t.kw+' "'+q(l[0]||'Name')+'" as '+n.id+(m.length?' {\n'+m.map(s=>'  '+s).join('\n')+'\n}':'')+'\n';return;
  }
  o+=t.kw+' "'+q(n.text)+'" as '+n.id+'\n';
 });
 const es=edges.slice();
 if(mode==='seq')es.sort((a,b)=>(a.y||0)-(b.y||0));
 if(es.length)o+='\n';
 es.forEach(e=>{
  const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
  o+=ref(a)+' '+K[e.kind||M[mode].ki[0]].op+' '+ref(b)+(e.label?' : '+q(e.label):'')+'\n';
 });
 return o+'@enduml\n';
}

function clip(c,dx,dy,hw,hh){
 if(!dx&&!dy)return c;
 const t=Math.min(dx?hw/Math.abs(dx):1e9,dy?hh/Math.abs(dy):1e9);
 return{x:c.x+dx*t,y:c.y+dy*t};
}
function geo(e){
 const A_=byId(e.from),B=byId(e.to);if(!A_||!B)return null;
 const sa=size(A_),sb=size(B),a=center(A_),b=center(B);
 if(mode==='seq'){
  const y=e.y||120;
  if(A_===B)return{d:`M${a.x} ${y}h44v24h-44`,mx:a.x+22,my:y-6};
  return{d:`M${a.x} ${y}L${b.x} ${y}`,mx:(a.x+b.x)/2,my:y-6};
 }
 const p=clip(a,b.x-a.x,b.y-a.y,sa.w/2,sa.h/2),q=clip(b,a.x-b.x,a.y-b.y,sb.w/2,sb.h/2);
 return{d:`M${p.x} ${p.y}L${q.x} ${q.y}`,mx:(p.x+q.x)/2,my:(p.y+q.y)/2-6};
}
const MK=(id,v,d,c)=>`<marker id="m${id}" viewBox="0 0 10 10" refX="${v}" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="${c}" d="${d}"/></marker>`;
const DEFS='<defs>'+MK('ar',9,'M0 0L10 5L0 10z','mk')+MK('tri',10,'M1 1L10 5L1 9z','mh')+MK('dia',10,'M0 5L5 1L10 5L5 9z','mk')+MK('dih',10,'M0 5L5 1L10 5L5 9z','mh')+'</defs>';

function drawEdges(){
 let h=DEFS;
 if(mode==='seq')nodes.forEach(n=>{const c=center(n),s=size(n);h+=`<line class="life" x1="${c.x}" y1="${n.y+s.h}" x2="${c.x}" y2="1300"/>`});
 edges.forEach(e=>{
  const g=geo(e);if(!g)return;
  const k=K[e.kind||M[mode].ki[0]],s=sel&&sel.k==='e'&&sel.id===e.id?' sel':'';
  h+=`<g data-id="${e.id}"><path class="ln${s}${k.d?' dsh':''}" d="${g.d}"${k.me?` marker-end="url(#m${k.me})"`:''}${k.ms?` marker-start="url(#m${k.ms})"`:''}/><path class="hit" d="${g.d}"/>`+
   (e.label?`<text class="lbl" x="${g.mx}" y="${g.my}" text-anchor="middle">${esc(e.label)}</text>`:'')+'</g>';
 });
 svg.innerHTML=h;
 svg.querySelectorAll('g[data-id]').forEach(g=>{
  const id=g.dataset.id;
  g.addEventListener('pointerdown',ev=>{
   ev.stopPropagation();select('e',id);
   if(mode!=='seq')return;
   const e=edges.find(x=>x.id===id),oy=ev.clientY-(e.y||120);let moved=false;
   const mv=m=>{moved=true;e.y=Math.max(90,m.clientY-oy);drawEdges()};
   const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);if(moved)render()};
   window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
  });
  g.addEventListener('dblclick',ev=>{
   const e=edges.find(x=>x.id===id),m=pt(ev);
   edit(m.x-75,m.y-14,e.label,v=>{e.label=v;render()});
  });
 });
}

function select(k,id){
 sel=k?{k,id}:null;
 nl.querySelectorAll('.node').forEach(d=>d.classList.toggle('sel',!!sel&&sel.k==='n'&&sel.id===d.dataset.id));
 svg.querySelectorAll('g[data-id]').forEach(g=>g.firstElementChild.classList.toggle('sel',!!sel&&sel.k==='e'&&sel.id===g.dataset.id));
 const e=sel&&sel.k==='e'&&edges.find(x=>x.id===sel.id),ks=$('#kind');
 ks.disabled=!e;if(e)ks.value=e.kind||M[mode].ki[0];
}

function edit(x,y,val,cb,multi){
 const i=document.createElement(multi?'textarea':'input');
 i.className='ed';i.value=val;i.style.left=x+'px';i.style.top=y+'px';
 stage.appendChild(i);i.focus();i.select();
 let done=false;
 const fin=ok=>{if(done)return;done=true;const v=i.value.trim();i.remove();if(ok)cb(v)};
 i.onkeydown=ev=>{ev.stopPropagation();if(ev.key==='Enter'&&(!multi||ev.ctrlKey)){ev.preventDefault();fin(true)}if(ev.key==='Escape')fin(false)};
 i.onblur=()=>fin(true);
}

function startConnect(e,n){
 e.preventDefault();e.stopPropagation();select('n',n.id);
 const tmp=document.createElementNS(NS,'line');tmp.setAttribute('class','tmp');svg.appendChild(tmp);
 const c=center(n);
 ['x1','x2'].forEach(a=>tmp.setAttribute(a,c.x));['y1','y2'].forEach(a=>tmp.setAttribute(a,c.y));
 const mv=ev=>{const p=pt(ev);tmp.setAttribute('x2',p.x);tmp.setAttribute('y2',p.y)};
 const up=ev=>{
  window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);tmp.remove();
  const p=pt(ev);let t=null;
  if(mode==='seq'){let best=1e9;nodes.forEach(m=>{const d=Math.abs(p.x-center(m).x);if(d<70&&d<best){best=d;t=m}})}
  else{const el=document.elementFromPoint(ev.clientX,ev.clientY),c2=el&&el.closest&&el.closest('.node');t=c2&&byId(c2.dataset.id)}
  if(t&&(mode==='seq'||t!==n)){
   const ed={id:'e'+(uid++),from:n.id,to:t.id,label:'',kind:M[mode].ki[0]};
   if(mode==='seq')ed.y=Math.max(100,p.y);
   edges.push(ed);sel={k:'e',id:ed.id};render();
  }
 };
 window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
}

function nodeEl(n){
 const t=T[n.type],s=size(n),d=document.createElement('div');
 d.className='node'+(sel&&sel.k==='n'&&sel.id===n.id?' sel':'');d.dataset.id=n.id;
 d.style.cssText=`left:${n.x}px;top:${n.y}px;width:${s.w}px;height:${s.h}px`;
 let inner='';
 if(!t.nt){
  if(t.cls){const l=n.text.split('\n');inner=`<div class="t cls"><div class="cn"${n.type==='abs'?' style="font-style:italic"':''}>${t.st?'<i>«'+t.st+'»</i>':''}${esc(l[0])}</div><div class="cm">${esc(l.slice(1).join('\n'))}</div></div>`}
  else inner=`<div class="t${n.type==='actor'?' pad':''}">${esc(n.text)}</div>`;
 }
 d.innerHTML=`<svg viewBox="0 0 ${s.w} ${s.h}">${t.s(s.w,s.h)}</svg>${inner}<i class="h" title="Drag to connect"></i>`;
 d.addEventListener('pointerdown',e=>{
  if(e.target.classList.contains('h')){startConnect(e,n);return}
  select('n',n.id);
  const sx=e.clientX-n.x,sy=e.clientY-n.y;
  const mv=ev=>{n.x=Math.max(0,ev.clientX-sx);n.y=mode==='seq'?20:Math.max(0,ev.clientY-sy);d.style.left=n.x+'px';d.style.top=n.y+'px';drawEdges()};
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);render()};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
 });
 d.addEventListener('dblclick',()=>{
  if(t.nt)return;
  if(t.cls)edit(n.x,n.y+s.h+4,n.text,v=>{if(v)n.text=v;render()},1);
  else edit(n.x,n.y+s.h/2-14,n.text,v=>{if(v)n.text=v;render()});
 });
 return d;
}

function render(){
 nl.innerHTML='';nodes.forEach(n=>nl.appendChild(nodeEl(n)));drawEdges();
 const c=gen();$('#code').value=c;
 const hex=Array.from(new TextEncoder().encode(c)).map(b=>b.toString(16).padStart(2,'0')).join('');
 $('#open').href='https://www.plantuml.com/plantuml/uml/~h'+hex;
 select(sel&&sel.k,sel&&sel.id);save();
}

function buildUI(){
 const tabs=$('#tabs');tabs.innerHTML='';
 Object.keys(M).forEach(m=>{const b=document.createElement('button');b.className='tab'+(m===mode?' on':'');b.textContent=M[m].n;b.onclick=()=>setMode(m);tabs.appendChild(b)});
 const ks=$('#kind');ks.innerHTML=M[mode].ki.map(k=>`<option value="${k}">${K[k].n}</option>`).join('');
 $('#ltrw').style.display=mode==='seq'?'none':'';$('#ltr').checked=ltr;$('#hint').textContent=M[mode].h;
 const P=$('#pal');P.innerHTML='<small>Drag onto the canvas (or click)</small>';
 M[mode].ty.forEach(k=>{
  const t=T[k],s=size({type:k,text:t.t||''}),d=document.createElement('div');
  d.className='pal';d.draggable=true;d.dataset.t=k;
  d.innerHTML=`<svg viewBox="0 0 ${s.w} ${s.h}" style="width:${Math.min(96,Math.round(34*s.w/s.h))}px">${t.s(s.w,s.h)}</svg><span>${t.n}</span>`;
  d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',k);e.dataTransfer.effectAllowed='copy'});
  d.addEventListener('click',()=>{
   const i=nodes.length%6,n=addNode(k,cv.scrollLeft+40+(mode==='seq'?i*150:i*24),cv.scrollTop+30+i*80);
   sel={k:'n',id:n.id};render();
  });
  P.appendChild(d);
 });
}

function setMode(m){
 docs[mode]={nodes,edges};mode=m;
 const d=docs[m];
 if(d){nodes=d.nodes;edges=d.edges}else{nodes=[];edges=[];EX[m]()}
 sel=null;buildUI();render();
}
function remove(){
 if(!sel)return;
 if(sel.k==='n'){const id=sel.id;nodes=nodes.filter(n=>n.id!==id);edges=edges.filter(e=>e.from!==id&&e.to!==id)}
 else{const id=sel.id;edges=edges.filter(e=>e.id!==id)}
 sel=null;render();
}

cv.addEventListener('dragover',e=>e.preventDefault());
cv.addEventListener('drop',e=>{
 e.preventDefault();const k=e.dataTransfer.getData('text/plain');
 if(!T[k]||!M[mode].ty.includes(k))return;
 const p=pt(e),s=size({type:k,text:T[k].t||''}),n=addNode(k,p.x-s.w/2,p.y-s.h/2);
 sel={k:'n',id:n.id};render();
});
stage.addEventListener('pointerdown',e=>{if(e.target===stage||e.target===svg||e.target===nl)select(null)});
$('#kind').onchange=e=>{const x=sel&&sel.k==='e'&&edges.find(y=>y.id===sel.id);if(x){x.kind=e.target.value;render()}};
$('#ltr').onchange=e=>{ltr=e.target.checked;render()};
$('#del').onclick=remove;
$('#clr').onclick=()=>{nodes=[];edges=[];sel=null;render()};
$('#ex').onclick=()=>{nodes=[];edges=[];sel=null;EX[mode]();render()};
$('#copy').onclick=async()=>{
 const t=$('#code').value,b=$('#copy');
 try{await navigator.clipboard.writeText(t)}catch(e){$('#code').select();try{document.execCommand('copy')}catch(_){}}
 b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy code',1400);
};
document.addEventListener('keydown',e=>{
 if((e.key==='Delete'||e.key==='Backspace')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();remove()}
});

if(!load())EX.flow();
buildUI();render();
</script>
</body>
</html>
